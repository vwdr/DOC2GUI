<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Doc2GUI Operator - Local Forms</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Doc2GUI Operator</h1>
      <p>Local demo forms for safe automation testing.</p>
    </header>
    <section class="card-grid">
      {% for form in forms %}
      <article class="card">
        <h2>{{ form.title }}</h2>
        <p>{{ form.description }}</p>
        <a class="button" href="/form/{{ form.form_id }}">Open form</a>
      </article>
      {% endfor %}
    </section>
  </main>
</body>
</html>
